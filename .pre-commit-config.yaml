# Run locally with `pre-commit install`, or `pre-commit run --all-files`.
# CI runs the same hooks, so a clean local run means a green Linter job.
exclude: |
  (?x)^(
      third_party/
    | tutorials/
    | tenseal/proto/.*\.pb\.(h|cc)
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Pinned to 18.x: it is what the Ubuntu runners ship and what the previous
  # lint_cpp.sh enforced, so the tracked sources are already clean under it.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c]

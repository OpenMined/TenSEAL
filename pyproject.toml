[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tenseal"
description = "A Library for Homomorphic Encryption Operations on Tensors"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# tenseal.tensors.plaintensor imports numpy at module scope, so importing
# tenseal fails without it. Previously undeclared, which made a bare
# `pip install tenseal` produce an unimportable package.
dependencies = ["numpy"]
authors = [{ name = "OpenMined", email = "info@openmined.org" }]
keywords = ["homomorphic", "encryption", "tensor", "deep learning", "privacy", "secure"]
classifiers = [
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
]
# Single source of truth stays tenseal/version.py; setuptools reads the literal
# statically, so importing the package (and its C extension) is not required.
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/OpenMined/TenSEAL"
Repository = "https://github.com/OpenMined/TenSEAL"
Issues = "https://github.com/OpenMined/TenSEAL/issues"

[dependency-groups]
# Install with `uv sync --group dev`, or `pip install --group dev`.
# black and flake8 are gone: ruff replaces both, via pre-commit.
dev = [
    "numpy",
    "pre-commit",
    "pytest",
    "pytest-benchmark[histogram]",
    "pytest-cov",
    "scikit-image",
    "setuptools",
    "torch",
    "torchvision",
]

[tool.setuptools.dynamic]
version = { attr = "tenseal.version.__version__" }

[tool.setuptools.packages.find]
include = ["tenseal", "tenseal.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist", "third_party", "tutorials"]

[tool.ruff.lint]
# Ruff's default set: pyflakes (F) plus the pycodestyle errors that catch real
# defects rather than style (E4 imports, E7 statements, E9 syntax). This is a
# superset of the flake8 config it replaces, which selected only
# E901,E999,F821,F822,F823.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Re-exports: these modules exist to widen the public API surface.
"__init__.py" = ["F401"]
# The test suites are built on `from ... import *` helpers, and assert against
# pybind11 objects where comparing to True/None is deliberate.
"tests/**" = ["E711", "E712", "E741", "F403", "F405", "F841"]
# FIXME: the CKKS test_add/test_sub/test_mul here are shadowed by BFV
# redefinitions of the same name and never run. Un-shadowing them changes which
# tests execute, so it is tracked separately from the lint migration.
"tests/python/tenseal/tensors/test_serialization.py" = [
    "E711",
    "E712",
    "E741",
    "F403",
    "F405",
    "F811",
    "F841",
]

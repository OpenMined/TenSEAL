name: Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  Linter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: .github/workflows/scripts/install_req_ubuntu.sh
      - name: Lint with flake8
        run: .github/workflows/scripts/lint_python.sh
      - name: Lint with clang-format
        run: .github/workflows/scripts/lint_cpp.sh

  Build:
    needs: [Linter]
    runs-on: ${{ matrix.target[0] }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - [ubuntu-24.04, manylinux_x86_64, ""]
          - [windows-2022, win_amd64, ""]
          - [macos-14, macosx_arm64, "14.0"]
        python:
          - cp311
          - cp312
          - cp313
          - cp314
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Check LongPathsEnabled
        run: |
          git config --system core.longpaths true
          (Get-ItemProperty "HKLM:System\CurrentControlSet\Control\FileSystem").LongPathsEnabled
        if: ${{ startsWith(matrix.target[0], 'windows') }}

      - name: Setup msbuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        if: ${{ startsWith(matrix.target[0], 'windows') }}

      # Pin the macOS toolchain to Xcode 15.4 (AppleClang 15) - the macos-14
      # default - so a future image bump to Xcode 16 can't reintroduce the
      # std::result_of / xtensor breakage. One line, no manual install.
      - name: Select Xcode 15.4 (macOS)
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
        if: ${{ startsWith(matrix.target[0], 'macos') }}

      - name: Build and test using cibuildwheel
        uses: pypa/cibuildwheel@298ed2fb2c105540f5ed055e8a6ad78d82dd3a7e # v3.3.1
        env:
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target[2] }}
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.target[1] }}
          CIBW_BUILD_VERBOSITY: 1
          # Use the runner's built-in CMake (4.x on macos-14) and let it accept
          # the old protobuf/json cmake_minimum_required floors instead of
          # installing an older CMake by hand. Inherited by protobuf's nested
          # cmake invocation.
          CIBW_ENVIRONMENT: "CMAKE_POLICY_VERSION_MINIMUM=3.5"
          # Build every supported version; run the test suite on the latest only.
          CIBW_TEST_SKIP: "cp311-* cp312-* cp313-*"
          CIBW_TEST_REQUIRES: "numpy pytest scikit-image"
          CIBW_TEST_COMMAND: >-
            pytest -m "not slow" -v {project}/tests/python/tenseal &&
            pytest -v {project}/tests/python/sealapi
          CIBW_TEST_COMMAND_LINUX: >-
            pytest -m "not slow" -v {project}/tests/python/tenseal &&
            pytest -v {project}/tests/python/sealapi &&
            sh -c "cd {project} && CMAKE_POLICY_VERSION_MINIMUM=3.5 cmake . -D BUILD_TEST=TRUE && make -j && CTEST_OUTPUT_ON_FAILURE=1 make test"
          CIBW_TEST_COMMAND_MACOS: >-
            pytest -m "not slow" -v {project}/tests/python/tenseal &&
            pytest -v {project}/tests/python/sealapi &&
            sh -c "cd {project} && CMAKE_POLICY_VERSION_MINIMUM=3.5 cmake . -D BUILD_TEST=TRUE && make -j && CTEST_OUTPUT_ON_FAILURE=1 make test"
        with:
          package-dir: .
          output-dir: wheelhouse

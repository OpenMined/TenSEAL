name: Build and Publish

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ${{ matrix.target[0] }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - [ubuntu-24.04, manylinux_x86_64, ""]
          - [windows-2022, win_amd64, ""]
          - [macos-14, macosx_arm64, "14.0"]
        python:
          - cp311
          - cp312
          - cp313
          - cp314

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Check LongPathsEnabled
        run: |
          git config --system core.longpaths true
          (Get-ItemProperty "HKLM:System\CurrentControlSet\Control\FileSystem").LongPathsEnabled
        if: ${{ startsWith(matrix.target[0], 'windows') }}

      - name: Setup msbuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        if: ${{ startsWith(matrix.target[0], 'windows') }}

      # Pin the macOS toolchain to Xcode 15.4 (AppleClang 15), the macos-14
      # default, so the (old) SEAL/xtensor build stays stable across image bumps.
      - name: Select Xcode 15.4 (macOS)
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
        if: ${{ startsWith(matrix.target[0], 'macos') }}

      - name: Build wheels using cibuildwheel
        uses: pypa/cibuildwheel@298ed2fb2c105540f5ed055e8a6ad78d82dd3a7e # v3.3.1
        env:
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target[2] }}
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.target[1] }}
          CIBW_BUILD_VERBOSITY: 1
          # Use the runner's built-in CMake (4.x on macos-14) and let it accept
          # the old protobuf/json cmake_minimum_required floors, instead of
          # installing an older CMake by hand.
          CIBW_ENVIRONMENT: "CMAKE_POLICY_VERSION_MINIMUM=3.5"
        with:
          package-dir: .
          output-dir: wheelhouse

      - name: Upload Artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: TenSEAL-${{ matrix.python }}-${{ matrix.target[0] }}
          path: ./wheelhouse/*.whl

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"

      - name: Install twine
        run: python -m pip install --upgrade twine

      - name: Publish wheels to PyPI
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: twine upload --repository pypi --skip-existing --verbose wheelhouse/*.whl
